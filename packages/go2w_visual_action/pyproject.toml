[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2w-visual-action-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "numpy>=1.23,<3", "pillow>=10,<13", "pydantic>=2.7,<3", "pypcd4>=1.5.1,<2"]

[tool.setuptools.packages.find]
include = ["go2w_visual_action*"]
